name: Windows desktop package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '.superpowers/**'

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source
        run: |
          npm run typecheck
          npm run lint

      - name: Prepare Electron distribution
        run: npm run prepare:windows-electron

      - name: Configure Windows release signing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK)) {
            throw 'Missing WINDOWS_CSC_LINK repository secret for a version-tag release.'
          }
          if ([string]::IsNullOrEmpty($env:WINDOWS_CSC_KEY_PASSWORD)) {
            throw 'Missing WINDOWS_CSC_KEY_PASSWORD repository secret for a version-tag release.'
          }
          if ($env:WINDOWS_CSC_LINK -match '[\r\n]' -or $env:WINDOWS_CSC_KEY_PASSWORD -match '[\r\n]') {
            throw 'Windows signing secrets must not contain newline characters.'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "CSC_LINK=$env:WINDOWS_CSC_LINK"
          Add-Content -Path $env:GITHUB_ENV -Value "CSC_KEY_PASSWORD=$env:WINDOWS_CSC_KEY_PASSWORD"

      - name: Build Windows packages
        run: npm run package:windows

      - name: Create artifact manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repositoryRoot = (Resolve-Path '.').Path

          function Get-ReleaseArtifact([string]$directory) {
            $files = @(Get-ChildItem -LiteralPath $directory -Filter '*.exe' -File)
            if ($files.Count -ne 1) {
              throw "Expected exactly one executable in $directory, found $($files.Count)"
            }
            return $files[0]
          }

          $artifacts = @(
            (Get-ReleaseArtifact 'dist/releases/nsis'),
            (Get-ReleaseArtifact 'dist/releases/portable')
          )
          $manifest = foreach ($artifact in $artifacts) {
            $relativePath = $artifact.FullName.Substring($repositoryRoot.Length + 1).Replace('\', '/')
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            [ordered]@{
              path = $relativePath
              bytes = $artifact.Length
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash
              signatureStatus = $signature.Status.ToString()
              signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'dist/releases/release-manifest.json'
          Get-Content -Raw 'dist/releases/release-manifest.json'

      - name: Enforce signed version-tag release
        if: startsWith(github.ref, 'refs/tags/v')
        run: node apps/windows/verify-release-manifest.mjs dist/releases/release-manifest.json

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Relay-Windows-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/releases/nsis/*.exe
            dist/releases/portable/*.exe
            dist/releases/release-manifest.json
          if-no-files-found: error
          retention-days: 90
